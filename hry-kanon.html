<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kanón</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;background:#06060e}
body{font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center}
canvas{display:block}
.back{position:fixed;top:12px;left:12px;z-index:90;color:#8a8fa0;text-decoration:none;font:600 14px/1 'Outfit',sans-serif;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);transition:.2s}
.back:hover{color:#f0f2f7;background:rgba(255,255,255,.12)}
.ov{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,6,14,.92);transition:opacity .4s}
.ov.hidden{opacity:0;pointer-events:none}
.ov h1{font-size:clamp(46px,12vw,76px);font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#d4a853 0%,#f7e6a8 40%,#d4a853 60%,#a07830 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(212,168,83,.35))}
.ov .sub{color:#8a8fa0;font-size:clamp(13px,3vw,17px);margin:6px 0 28px;font-weight:400;text-align:center;padding:0 20px}
.ov button{font-family:inherit;font-size:20px;font-weight:700;padding:14px 48px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#d4a853,#a07830);color:#06060e;letter-spacing:1px;transition:.2s;box-shadow:0 0 30px rgba(212,168,83,.25)}
.ov button:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(212,168,83,.4)}
.ov.go h1{-webkit-text-fill-color:#ef4444;filter:drop-shadow(0 0 20px rgba(239,68,68,.3))}
.ov .st{color:#8a8fa0;font-size:16px;margin:4px 0}
.ov .st b{color:#f0f2f7;font-weight:700}
</style>
</head>
<body>
<a href="hry.html" class="back">← Zpět</a>
<canvas id="c"></canvas>

<div class="ov" id="ov-start">
  <h1>KANÓN</h1>
  <p class="sub">Vystřel projektil, odraz se od desek<br>a vyzbrojuj kovboje proti nepřátelům!</p>
  <button id="btn-start">HRÁT</button>
</div>

<div class="ov hidden go" id="ov-go">
  <h1>KONEC</h1>
  <p class="st">Vlna: <b id="go-w">0</b></p>
  <p class="st">Skóre: <b id="go-s">0</b></p>
  <p class="st">Nejlepší: <b id="go-b">0</b></p>
  <button id="btn-retry" style="margin-top:20px">ZNOVU</button>
</div>

<script>
(function(){
'use strict';
const C=document.getElementById('c'), X=C.getContext('2d');
const GW=400, GH=750;
let sc=1, oX=0, oY=0;

function resize(){
  C.width=innerWidth; C.height=innerHeight;
  const sx=C.width/GW, sy=C.height/GH;
  sc=Math.min(sx,sy);
  oX=(C.width-GW*sc)/2; oY=(C.height-GH*sc)/2;
}
addEventListener('resize',resize); resize();

function toGame(cx,cy){ return{x:(cx-oX)/sc, y:(cy-oY)/sc}; }

/* ── Audio ── */
let AC;
function ia(){ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); }
function snd(f,d,t,v){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=t||'sine'; o.frequency.value=f;
  g.gain.value=v||.1;
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+d);
}

/* ── Helpers ── */
function fmt(n){
  if(n>=1e12)return(n/1e12).toFixed(1)+'T';
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return String(Math.floor(n));
}
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function bCol(m){
  if(m>=999)return'#ec4899';if(m>=50)return'#ef4444';
  if(m>=20)return'#f97316';if(m>=10)return'#eab308';
  if(m>=5)return'#22c55e';return'#3b82f6';
}
function rr(x,y,w,h,r){
  X.beginPath();X.moveTo(x+r,y);X.lineTo(x+w-r,y);
  X.quadraticCurveTo(x+w,y,x+w,y+r);X.lineTo(x+w,y+h-r);
  X.quadraticCurveTo(x+w,y+h,x+w-r,y+h);X.lineTo(x+r,y+h);
  X.quadraticCurveTo(x,y+h,x,y+h-r);X.lineTo(x,y+r);
  X.quadraticCurveTo(x,y,x+r,y);X.closePath();
}

const stars=Array.from({length:80},()=>({
  x:Math.random()*GW, y:Math.random()*GH*.5,
  r:.3+Math.random()*1, a:.15+Math.random()*.5
}));

/* ── State ── */
const GRAV=0.13, WALLD=0.88, MAXLIFE=600;
let phase='start';
let wave=0, score=0, shotsLeft=0;
let cannon={x:GW/2, y:GH-42, angle:-Math.PI/2, bl:30};
let ball=null, ballLife=0;
let boards=[], chain=[], ammo=10;
let enemies=[];
let cAmmo=0, cRate=0, cBullets=[], cowFlash=0;
let particles=[], floats=[];
let shake={x:0,y:0,i:0};
let revealVal=0, revealT=0;
let delayT=0;

/* ── Particles / Floats ── */
function spP(x,y,c,n,s){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=Math.random()*s;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      life:1,dec:.02+Math.random()*.025,color:c,sz:1.5+Math.random()*3.5});
  }
}
function spF(x,y,t,c,s){ floats.push({x,y,text:t,color:c,size:s||18,life:1,vy:-1.5}); }

/* ── Board Generation ── */
function genBoards(){
  boards=[]; chain=[]; ammo=10;
  const mega=wave>=20?99999:wave>=10?9999:999;
  const lo=wave>8?5:wave>4?3:2;
  const md=wave>8?14:wave>4?10:5;
  const defs=[
    {x:65,y:535,m:lo},{x:165,y:542,m:lo},{x:255,y:533,m:lo+1},{x:345,y:540,m:lo},
    {x:100,y:455,m:lo},{x:205,y:448,m:md},{x:315,y:455,m:lo},
    {x:55,y:372,m:md},{x:155,y:365,m:md},{x:255,y:370,m:md+5},{x:355,y:375,m:md},
    {x:110,y:288,m:14},{x:210,y:280,m:23},{x:320,y:288,m:14},
    {x:75,y:202,m:23},{x:200,y:192,m:mega,mv:1},{x:330,y:202,m:50},
    {x:140,y:118,m:50},{x:270,y:115,m:23}
  ];
  defs.forEach(d=>{
    const w=d.m>=999?26:d.m>=20?36:d.m>=10?42:d.m>=5?46:52;
    const h=d.m>=999?15:22;
    boards.push({
      x:d.x+(Math.random()-.5)*10, y:d.y+(Math.random()-.5)*6,
      bx:d.x, w,h, mult:d.m, hit:false, fl:0, mv:!!d.mv
    });
  });
}

/* ── Enemy Generation ── */
function genEnemies(){
  enemies=[];
  const n=Math.min(3+Math.floor(wave/2),10);
  const hp=Math.ceil(12*Math.pow(2.3,wave-1));
  for(let i=0;i<n;i++){
    const h=hp+Math.floor(Math.random()*hp*.25);
    enemies.push({hp:h,mhp:h,type:'b',dead:false,ht:0,x:0,y:0});
  }
  if(wave%5===0){
    const bh=hp*5;
    enemies.push({hp:bh,mhp:bh,type:'boss',dead:false,ht:0,x:0,y:0});
  }
  posEn();
}
function posEn(){
  const alive=enemies.filter(e=>!e.dead);
  const sp=Math.min(42,(GW-140)/(alive.length+1));
  alive.forEach((e,i)=>{e.x=140+(i+1)*sp; e.y=420;});
}

/* ── Circle-AABB Collision ── */
function cRect(cx,cy,cr,b){
  const bx=b.x-b.w/2, by=b.y-b.h/2;
  const nx=cl(cx,bx,bx+b.w), ny=cl(cy,by,by+b.h);
  const dx=cx-nx, dy=cy-ny, d=Math.sqrt(dx*dx+dy*dy);
  if(d<cr){
    let nnx,nny;
    if(d>.01){nnx=dx/d;nny=dy/d;}
    else{
      const dl=cx-bx,dr=bx+b.w-cx,dt=cy-by,db=by+b.h-cy;
      const mn=Math.min(dl,dr,dt,db);
      if(mn===dl){nnx=-1;nny=0;}else if(mn===dr){nnx=1;nny=0;}
      else if(mn===dt){nnx=0;nny=-1;}else{nnx=0;nny=1;}
    }
    return{hit:true,nx:nnx,ny:nny,ov:cr-d};
  }
  return{hit:false};
}

/* ── Fire Cannon ── */
function fireCannon(){
  if(phase!=='aiming'||shotsLeft<=0)return;
  shotsLeft--;
  const spd=11;
  const bx=cannon.x+Math.cos(cannon.angle)*cannon.bl;
  const by=cannon.y+Math.sin(cannon.angle)*cannon.bl;
  ball={x:bx,y:by,vx:Math.cos(cannon.angle)*spd,vy:Math.sin(cannon.angle)*spd,r:6,trail:[]};
  ballLife=0; chain=[]; ammo=10;
  phase='pinball';
  snd(70,.3,'sine',.15);
  spP(bx,by,'#f59e0b',8,3);
  if(navigator.vibrate)navigator.vibrate(25);
}

/* ── Phase Transitions ── */
function endPinball(){
  ball=null;
  revealVal=0; revealT=0;
  phase='reveal';
}

function startCombat(){
  cAmmo=ammo; cRate=Math.max(1,Math.ceil(cAmmo/180));
  cBullets=[]; cowFlash=0;
  posEn();
  phase='combat';
}

function endCombat(){
  if(enemies.every(e=>e.dead)){
    score+=wave*200+ammo;
    delayT=90; phase='waveEnd';
    spF(GW/2,GH/2-30,'VLNA '+wave+' HOTOVO!','#22c55e',26);
    spF(48,380,'YEE-HAW!','#d4a853',18);
    snd(523,.12,'triangle',.1);
    setTimeout(()=>snd(659,.12,'triangle',.1),80);
    setTimeout(()=>snd(784,.18,'triangle',.12),160);
    if(navigator.vibrate)navigator.vibrate([50,30,80]);
  } else if(shotsLeft>0){
    delayT=50; phase='nextShot';
    spF(GW/2,GH/2-30,'DALŠÍ VÝSTŘEL...','#d4a853',20);
  } else {
    phase='gameover'; showGO();
  }
}

function startWave(){
  wave++; shotsLeft=3;
  genEnemies(); genBoards();
  phase='aiming';
  const th=enemies.reduce((s,e)=>s+e.hp,0);
  spF(GW/2,GH/2-10,'VLNA '+wave,'#d4a853',28);
  spF(GW/2,GH/2+20,'Celkem HP: '+fmt(th),'#5a5e6e',14);
}

function startGame(){
  ia(); wave=0; score=0;
  particles=[]; floats=[];
  document.getElementById('ov-start').classList.add('hidden');
  document.getElementById('ov-go').classList.add('hidden');
  startWave();
}

function showGO(){
  let best=parseInt(localStorage.getItem('kanon-best')||'0');
  if(score>best){best=score;localStorage.setItem('kanon-best',String(best));}
  document.getElementById('go-w').textContent=wave;
  document.getElementById('go-s').textContent=fmt(score);
  document.getElementById('go-b').textContent=fmt(best);
  document.getElementById('ov-go').classList.remove('hidden');
}

document.getElementById('btn-start').onclick=startGame;
document.getElementById('btn-retry').onclick=startGame;

/* ── Input ── */
C.addEventListener('pointermove',e=>{
  const g=toGame(e.clientX,e.clientY);
  const dx=g.x-cannon.x, dy=g.y-cannon.y;
  cannon.angle=cl(Math.atan2(dy,dx),-Math.PI+.12,-.12);
});
C.addEventListener('pointerup',()=>{ if(phase==='aiming')fireCannon(); });

/* ── Update ── */
function update(){
  /* Shake */
  if(shake.i>.3){shake.x=(Math.random()-.5)*shake.i;shake.y=(Math.random()-.5)*shake.i;shake.i*=.87;}
  else{shake.x=0;shake.y=0;shake.i=0;}

  /* Particles */
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.life-=p.dec;return p.life>0;
  });
  /* Floats */
  floats=floats.filter(f=>{f.y+=f.vy;f.life-=.012;return f.life>0;});
  /* Board timers */
  boards.forEach(b=>{
    if(b.fl>0)b.fl-=.03;
    if(b.mv)b.x=b.bx+Math.sin(Date.now()*.0015)*50;
  });
  /* Enemy flash */
  enemies.forEach(e=>{if(e.ht>0)e.ht-=.06;});

  /* ── Pinball Phase ── */
  if(phase==='pinball'&&ball){
    ballLife++;
    ball.vy+=GRAV;
    ball.x+=ball.vx; ball.y+=ball.vy;

    ball.trail.push({x:ball.x,y:ball.y,l:1});
    if(ball.trail.length>28)ball.trail.shift();
    ball.trail.forEach(t=>{t.l-=.045;});

    /* Walls */
    if(ball.x<ball.r){
      ball.x=ball.r;ball.vx=Math.abs(ball.vx)*WALLD;ball.vy*=WALLD;
      spP(ball.r,ball.y,'#555',3,2);
    }
    if(ball.x>GW-ball.r){
      ball.x=GW-ball.r;ball.vx=-Math.abs(ball.vx)*WALLD;ball.vy*=WALLD;
      spP(GW-ball.r,ball.y,'#555',3,2);
    }
    if(ball.y<ball.r+30){
      ball.y=ball.r+30;ball.vy=Math.abs(ball.vy)*WALLD;ball.vx*=WALLD;
      spP(ball.x,ball.r+30,'#555',3,2);
    }

    /* Board collisions */
    boards.forEach(b=>{
      const c=cRect(ball.x,ball.y,ball.r,b);
      if(!c.hit)return;
      /* Reflect */
      const dot=ball.vx*c.nx+ball.vy*c.ny;
      ball.vx-=2*dot*c.nx; ball.vy-=2*dot*c.ny;
      ball.x+=c.nx*(c.ov+.5); ball.y+=c.ny*(c.ov+.5);
      /* Speed adjust */
      const sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      const ns=b.hit?sp*.94:Math.min(sp*1.04,14);
      if(sp>.01){ball.vx=ball.vx/sp*ns;ball.vy=ball.vy/sp*ns;}

      if(!b.hit){
        b.hit=true; b.fl=1;
        ammo*=b.mult;
        chain.push(b.mult);
        const col=bCol(b.mult);
        spP(b.x,b.y,col,10+Math.min(b.mult/3,25),3.5);
        spF(b.x,b.y-18,'×'+fmt(b.mult),col,22);
        shake.i=Math.min(b.mult/8,14);
        snd(280+b.mult*.6,.14,'triangle',.08);
        if(navigator.vibrate)navigator.vibrate(cl(b.mult/4,5,40));
        if(b.mult>=999){
          spP(b.x,b.y,'#fff',35,5);
          shake.i=18;
          spF(b.x,b.y+16,fmt(ammo)+'!','#fff',26);
        }
      }
    });

    if(ball.y>GH+20||ballLife>MAXLIFE)endPinball();
  }

  /* ── Ammo Reveal ── */
  if(phase==='reveal'){
    revealT++;
    const spd=Math.max(1,(ammo-revealVal)*.08);
    revealVal=Math.min(revealVal+spd,ammo);
    if(revealT%6===0)snd(250+revealVal*.002,.04,'square',.03);
    if(revealT>110||(Math.abs(revealVal-ammo)<1&&revealT>45)){
      revealVal=ammo;
      startCombat();
    }
  }

  /* ── Combat Phase ── */
  if(phase==='combat'){
    const tgt=enemies.find(e=>!e.dead);
    if(!tgt||cAmmo<=0){endCombat();return;}
    const toFire=Math.min(cRate,cAmmo);
    let rem=toFire, cur=tgt;
    while(rem>0&&cur){
      const dmg=Math.min(rem,cur.hp);
      cur.hp-=dmg; cAmmo-=dmg; rem-=dmg;
      cur.ht=1;
      if(cur.hp<=0){
        cur.dead=true;
        spP(cur.x,cur.y,'#f59e0b',22,5);
        spF(cur.x,cur.y-28,'KILL!','#f59e0b',22);
        score+=cur.mhp;
        snd(500,.1,'square',.07);
        cur=enemies.find(e=>!e.dead);
      }
    }
    cowFlash=.8;

    if(cBullets.length<12){
      const t2=enemies.find(e=>!e.dead);
      if(t2){
        const dx2=t2.x-78, dy2=t2.y-416;
        const d2=Math.sqrt(dx2*dx2+dy2*dy2)||1;
        cBullets.push({x:78,y:416,vx:dx2/d2*16,vy:dy2/d2*16,life:1});
      }
    }
    cBullets=cBullets.filter(b=>{b.x+=b.vx;b.y+=b.vy;b.life-=.07;return b.life>0&&b.x<GW+10;});

    if(enemies.every(e=>e.dead)||cAmmo<=0)endCombat();
  }

  /* ── Delays ── */
  if(phase==='waveEnd'){delayT--;if(delayT<=0)startWave();}
  if(phase==='nextShot'){delayT--;if(delayT<=0){genBoards();phase='aiming';}}
}

/* ═══════════ DRAW ═══════════ */

function drawStarBg(){
  const g=X.createLinearGradient(0,0,0,GH);
  g.addColorStop(0,'#0c0518');g.addColorStop(.5,'#0a0f20');g.addColorStop(1,'#0e1018');
  X.fillStyle=g;X.fillRect(0,0,GW,GH);
  X.save();
  stars.forEach(s=>{
    X.globalAlpha=s.a*(.6+.4*Math.sin(Date.now()*.0008+s.x));
    X.fillStyle='#fff';X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);X.fill();
  });
  X.restore();
}

function drawWalls(){
  X.save();X.strokeStyle='rgba(212,168,83,.06)';X.lineWidth=1.5;
  X.beginPath();X.moveTo(1,30);X.lineTo(1,GH);X.stroke();
  X.beginPath();X.moveTo(GW-1,30);X.lineTo(GW-1,GH);X.stroke();
  X.beginPath();X.moveTo(0,31);X.lineTo(GW,31);X.stroke();
  X.restore();
}

function drawCannon(){
  X.save();X.translate(cannon.x,cannon.y);
  X.fillStyle='#1a1520';X.strokeStyle='#3a3040';X.lineWidth=2;
  rr(-20,-7,40,28,5);X.fill();X.stroke();
  X.save();X.rotate(cannon.angle);
  const gr=X.createLinearGradient(0,-4,0,4);
  gr.addColorStop(0,'#d4a853');gr.addColorStop(1,'#8a6520');
  X.fillStyle=gr;rr(0,-4,cannon.bl+3,8,3);X.fill();
  X.strokeStyle='#e8c56d';X.lineWidth=1;X.stroke();
  X.restore();
  X.fillStyle='#d4a853';X.beginPath();X.arc(0,0,7,0,Math.PI*2);X.fill();
  X.fillStyle='#a07830';X.beginPath();X.arc(0,0,3.5,0,Math.PI*2);X.fill();
  X.restore();
}

function drawAim(){
  if(phase!=='aiming')return;
  const sx=cannon.x+Math.cos(cannon.angle)*cannon.bl;
  const sy=cannon.y+Math.sin(cannon.angle)*cannon.bl;
  let tx=sx,ty=sy,tvx=Math.cos(cannon.angle)*11,tvy=Math.sin(cannon.angle)*11;
  X.save();X.fillStyle='rgba(212,168,83,.25)';
  for(let i=0;i<100;i++){
    tvy+=GRAV;tx+=tvx;ty+=tvy;
    if(tx<6){tx=6;tvx=Math.abs(tvx)*WALLD;}
    if(tx>GW-6){tx=GW-6;tvx=-Math.abs(tvx)*WALLD;}
    if(ty<36){ty=36;tvy=Math.abs(tvy)*WALLD;}
    if(ty>GH)break;
    if(i%3===0){X.globalAlpha=.28*(1-i/100);X.beginPath();X.arc(tx,ty,1.8,0,Math.PI*2);X.fill();}
  }
  X.restore();
}

function drawBoards(){
  boards.forEach(b=>{
    X.save();
    const col=bCol(b.mult);
    if(!b.hit&&b.mult>=999){
      X.shadowColor=col;X.shadowBlur=10+6*Math.sin(Date.now()*.004);
    }
    if(b.hit)X.globalAlpha=.18+(b.fl>.5?b.fl*.5:0);
    rr(b.x-b.w/2,b.y-b.h/2,b.w,b.h,4);
    X.fillStyle=b.fl>.6?'#fff':col;X.fill();
    X.strokeStyle=b.hit?'#444':col;X.lineWidth=1.5;X.stroke();
    X.shadowBlur=0;
    X.fillStyle=b.hit?'#555':'#fff';
    const fs=b.mult>=1000?9:b.mult>=100?10:12;
    X.font=`bold ${fs}px Outfit,sans-serif`;X.textAlign='center';X.textBaseline='middle';
    X.fillText('×'+fmt(b.mult),b.x,b.y+1);
    X.restore();
  });
}

function drawBall(){
  if(!ball)return;
  X.save();
  ball.trail.forEach(t=>{
    if(t.l<=0)return;
    X.globalAlpha=t.l*.3;X.fillStyle='#f59e0b';
    X.beginPath();X.arc(t.x,t.y,ball.r*t.l*.55,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;X.shadowColor='#f59e0b';X.shadowBlur=18;
  const g=X.createRadialGradient(ball.x,ball.y,0,ball.x,ball.y,ball.r);
  g.addColorStop(0,'#fff');g.addColorStop(.35,'#fde68a');
  g.addColorStop(.75,'#f59e0b');g.addColorStop(1,'rgba(245,158,11,0)');
  X.fillStyle=g;X.beginPath();X.arc(ball.x,ball.y,ball.r*1.6,0,Math.PI*2);X.fill();
  X.shadowBlur=0;X.fillStyle='#fff';
  X.beginPath();X.arc(ball.x,ball.y,ball.r*.3,0,Math.PI*2);X.fill();
  X.restore();
}

function drawChain(){
  if(chain.length===0)return;
  if(phase!=='pinball'&&phase!=='reveal')return;
  X.save();X.textAlign='center';
  const parts=chain.slice(-6).map(m=>'×'+fmt(m));
  X.font='600 10px Outfit,sans-serif';X.fillStyle='#8a8fa0';
  X.fillText(parts.join(' → '),GW/2,18);
  const sz=ammo>=10000?28:ammo>=1000?24:ammo>=100?20:16;
  X.font=`900 ${sz}px Outfit,sans-serif`;
  X.fillStyle=ammo>=10000?'#ec4899':ammo>=1000?'#f97316':ammo>=100?'#eab308':'#d4a853';
  X.shadowColor=X.fillStyle;X.shadowBlur=8;
  X.fillText(fmt(ammo),GW/2,42);
  X.restore();
}

function drawReveal(){
  if(phase!=='reveal')return;
  X.save();
  X.fillStyle='rgba(6,6,14,.82)';X.fillRect(0,0,GW,GH);
  X.textAlign='center';
  X.fillStyle='#5a5e6e';X.font='600 17px Outfit,sans-serif';
  X.fillText('MUNICE PRO KOVBOJE',GW/2,GH/2-50);
  const n=Math.floor(revealVal);
  const sz=n>=10000?48:n>=1000?42:36;
  X.font=`900 ${sz}px Outfit,sans-serif`;
  X.fillStyle=n>=10000?'#ec4899':n>=1000?'#f97316':n>=100?'#eab308':'#f0f2f7';
  X.shadowColor=X.fillStyle;X.shadowBlur=16;
  X.fillText(fmt(n),GW/2,GH/2+12);
  X.shadowBlur=0;
  if(chain.length>0){
    const p2=chain.map(m=>'×'+fmt(m));
    X.font='500 11px Outfit,sans-serif';X.fillStyle='#444';
    X.fillText(p2.join(' → '),GW/2,GH/2+45);
  }
  X.restore();
}

/* ── Combat Scene ── */
function drawCombatBg(){
  const g=X.createLinearGradient(0,0,0,GH);
  g.addColorStop(0,'#0c0518');g.addColorStop(.55,'#12101e');g.addColorStop(1,'#1a1510');
  X.fillStyle=g;X.fillRect(0,0,GW,GH);
  X.fillStyle='#1f1a12';X.fillRect(0,438,GW,312);
  X.strokeStyle='#2a2418';X.lineWidth=1;
  X.beginPath();X.moveTo(0,438);X.lineTo(GW,438);X.stroke();
}

function drawCowboy(){
  X.save();X.translate(48,420);
  X.fillStyle='#5c3a1e';X.fillRect(-7,12,6,10);X.fillRect(2,12,6,10);
  X.fillStyle='#b83227';
  X.beginPath();X.moveTo(-12,-6);X.lineTo(12,-6);X.lineTo(14,12);X.lineTo(-14,12);X.closePath();X.fill();
  X.fillStyle='#5c3a1e';X.fillRect(-12,4,24,3);
  X.fillStyle='#d4a853';X.fillRect(-2,4,4,3);
  X.fillStyle='#e8b87a';X.beginPath();X.arc(0,-14,8,0,Math.PI*2);X.fill();
  X.fillStyle='#333';X.fillRect(-4,-15,2.5,2);X.fillRect(1.5,-15,2.5,2);
  X.fillStyle='#8B4513';X.fillRect(-14,-20,28,3);X.fillRect(-7,-28,14,9);
  X.fillStyle='#a0522d';X.fillRect(-6,-27,12,4);
  /* Gun arm */
  X.save();X.translate(10,-2);
  X.fillStyle='#e8b87a';X.fillRect(0,-2,14,4);
  X.fillStyle='#444';X.fillRect(12,-3,10,3);
  if(cowFlash>.3){
    X.globalAlpha=cowFlash;X.fillStyle='#fde68a';
    X.beginPath();X.arc(22,-1.5,3+cowFlash*3,0,Math.PI*2);X.fill();
    X.fillStyle='#fff';X.beginPath();X.arc(22,-1.5,1.5,0,Math.PI*2);X.fill();
  }
  X.restore();
  X.restore();
  cowFlash=Math.max(0,cowFlash-.05);
}

function drawCombatEn(){
  enemies.forEach(e=>{
    X.save();X.translate(e.x,e.y);
    const s=e.type==='boss'?1.45:1;
    X.scale(s,s);
    if(e.dead){X.globalAlpha=.12;}
    else if(e.ht>.5){X.globalAlpha=.4+Math.random()*.6;}
    X.fillStyle=e.type==='boss'?'#7c1d1d':'#c0392b';
    X.fillRect(-6,-3,12,16);
    X.beginPath();X.arc(0,-9,5.5,0,Math.PI*2);X.fill();
    X.fillStyle=e.type==='boss'?'#3b1010':'#5c2018';
    X.fillRect(-9,-13,18,2.5);X.fillRect(-4,-20,8,7);
    X.fillStyle='#ddd';
    X.beginPath();X.arc(-1.5,-10,1,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(1.5,-10,1,0,Math.PI*2);X.fill();
    X.globalAlpha=e.dead?.12:1;
    if(!e.dead){
      const bw=e.type==='boss'?40:28, hp=e.hp/e.mhp;
      X.fillStyle='#1a1a2a';rr(-bw/2,-28,bw,5,2);X.fill();
      if(hp>0){X.fillStyle=hp>.5?'#22c55e':hp>.25?'#f59e0b':'#ef4444';rr(-bw/2,-28,bw*hp,5,2);X.fill();}
      X.fillStyle='#aaa';X.font='bold 7px Outfit,sans-serif';X.textAlign='center';
      X.fillText(fmt(e.hp),0,-33);
    }
    X.restore();
  });
}

function drawCBullets(){
  X.save();X.fillStyle='#fde68a';
  cBullets.forEach(b=>{
    X.globalAlpha=b.life;X.beginPath();X.arc(b.x,b.y,2,0,Math.PI*2);X.fill();
  });
  X.restore();
}

/* ── HUD ── */
function drawHUD(){
  X.save();
  X.fillStyle='#5a5e6e';X.font='600 12px Outfit,sans-serif';X.textAlign='left';
  X.fillText('VLNA',12,GH-26);
  X.fillStyle='#d4a853';X.font='bold 16px Outfit,sans-serif';
  X.fillText(String(wave),12,GH-8);

  X.fillStyle='#5a5e6e';X.font='600 12px Outfit,sans-serif';X.textAlign='right';
  X.fillText('SKÓRE',GW-12,GH-26);
  X.fillStyle='#f0f2f7';X.font='bold 16px Outfit,sans-serif';
  X.fillText(fmt(score),GW-12,GH-8);

  X.textAlign='center';
  for(let i=0;i<3;i++){
    X.fillStyle=i<shotsLeft?'#d4a853':'#2a2530';
    X.beginPath();X.arc(GW/2-14+i*14,GH-14,4.5,0,Math.PI*2);X.fill();
  }

  if(phase==='combat'){
    X.fillStyle='#5a5e6e';X.font='600 12px Outfit,sans-serif';X.textAlign='center';
    X.fillText('MUNICE',GW/2,22);
    X.fillStyle=cAmmo>1000?'#ec4899':cAmmo>100?'#f97316':'#eab308';
    X.font='bold 20px Outfit,sans-serif';
    X.fillText(fmt(cAmmo),GW/2,44);
  }
  X.restore();
}

function drawParts(){
  particles.forEach(p=>{
    X.globalAlpha=p.life;X.fillStyle=p.color;
    X.beginPath();X.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;
}
function drawFloats(){
  floats.forEach(f=>{
    X.save();X.globalAlpha=Math.min(f.life*2,1);
    X.fillStyle=f.color;X.font=`bold ${f.size}px Outfit,sans-serif`;
    X.textAlign='center';X.shadowColor=f.color;X.shadowBlur=6;
    X.fillText(f.text,f.x,f.y);X.restore();
  });
}

/* ── Main Draw ── */
function draw(){
  X.save();
  X.translate(oX,oY);X.scale(sc,sc);
  X.translate(shake.x,shake.y);

  const isCombat=phase==='combat'||phase==='waveEnd'||phase==='nextShot';
  if(isCombat){
    drawCombatBg();
    drawCombatEn();
    drawCBullets();
    drawCowboy();
  } else {
    drawStarBg();
    drawWalls();
    drawBoards();
    drawBall();
    drawAim();
    drawCannon();
    drawChain();
  }

  drawParts();
  drawFloats();
  drawHUD();
  drawReveal();

  X.restore();
}

/* ── Loop ── */
function loop(){
  if(phase!=='start'&&phase!=='gameover')update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
