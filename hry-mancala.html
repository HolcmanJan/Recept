<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mancala</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #08090c;
  --bg1: #0e1015;
  --bg2: #14161d;
  --bg3: #1a1d28;
  --text: #f0f2f7;
  --muted: #5a5e6e;
  --muted2: #8a8fa0;
  --gold: #d4a853;
  --gold2: #e8c56d;
  --gold-glow: rgba(212,168,83,.35);
  --gold-deep: #a07830;
  --cyan: #38bdf8;
  --cyan-glow: rgba(56,189,248,.25);
  --glass: rgba(255,255,255,.04);
  --glass2: rgba(255,255,255,.07);
  --glass3: rgba(255,255,255,.11);
  --border: rgba(255,255,255,.06);
  --border2: rgba(255,255,255,.12);
  --p1: #d4a853;
  --p1-glow: rgba(212,168,83,.3);
  --p2: #38bdf8;
  --p2-glow: rgba(56,189,248,.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;}

/* ── ANIMATED BACKGROUND ── */
body {
  background: var(--bg0);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100dvh;
  overflow-x: hidden;
  display:flex; flex-direction:column;
}
body::before {
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 25% 0%, rgba(212,168,83,.08) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 75% 100%, rgba(56,189,248,.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(212,168,83,.03) 0%, transparent 70%);
  animation: bgShift 12s ease-in-out infinite alternate;
}
@keyframes bgShift {
  0%   { opacity:.8; transform:scale(1); }
  100% { opacity:1;  transform:scale(1.05); }
}
/* Noise overlay */
body::after {
  content:'';
  position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 128px 128px;
}

/* ── HEADER ── */
header {
  position:relative; z-index:2;
  padding:1.2rem 1.2rem .5rem;
  max-width:720px; margin:0 auto; width:100%;
  display:flex; align-items:center; justify-content:space-between;
}
.logo { display:flex; align-items:center; gap:.7rem; }
.logo-icon {
  width:36px; height:36px;
  background: linear-gradient(135deg, var(--gold), var(--gold-deep));
  border-radius:10px;
  display:flex; align-items:center; justify-content:center; font-size:1.1rem;
  box-shadow: 0 0 20px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,.2);
}
.logo-text { font-size:1.15rem; font-weight:700; letter-spacing:-.02em; }
.logo-text span { color:var(--gold2); }
.btn-back {
  background:var(--glass2); border:1px solid var(--border);
  border-radius:8px; padding:.32rem .8rem;
  font-size:.72rem; font-weight:500; color:var(--muted2);
  cursor:pointer; transition:all .2s;
  font-family:'Outfit',sans-serif; text-decoration:none;
}
.btn-back:hover { background:var(--glass3); border-color:var(--border2); color:var(--text); }

/* ── MODE SELECT ── */
.overlay {
  position:fixed; inset:0; z-index:100;
  background: rgba(8,9,12,.94);
  backdrop-filter: blur(16px);
  display:flex; align-items:center; justify-content:center;
  opacity:1; transition: opacity .5s;
}
.overlay.hidden { opacity:0; pointer-events:none; }

.mode-card {
  background: linear-gradient(145deg, var(--bg2), var(--bg3));
  border: 1px solid var(--border2);
  border-radius: 28px;
  padding: 2.8rem 2.2rem;
  width: min(400px, 88vw);
  text-align: center;
  box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 80px rgba(212,168,83,.06);
  position:relative; overflow:hidden;
}
.mode-card::before {
  content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
  background: conic-gradient(from 0deg, transparent, rgba(212,168,83,.04), transparent, rgba(56,189,248,.03), transparent);
  animation: cardGlow 8s linear infinite;
  pointer-events:none;
}
@keyframes cardGlow { to { transform:rotate(360deg); } }

.mode-card h2 {
  position:relative;
  font-size:1.7rem; font-weight:800; margin-bottom:.3rem;
  background: linear-gradient(135deg, var(--gold2), var(--cyan));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.mode-card > p { position:relative; color:var(--muted2); font-size:.88rem; margin-bottom:1.8rem; }
.mode-buttons { position:relative; display:flex; flex-direction:column; gap:.7rem; }
.mode-btn {
  display:flex; align-items:center; gap:.9rem;
  background: var(--glass2); border:1px solid var(--border);
  border-radius:16px; padding:1.1rem 1.3rem;
  cursor:pointer; transition:all .3s;
  font-family:'Outfit',sans-serif; text-align:left; color:var(--text);
}
.mode-btn:hover {
  background:var(--glass3); border-color:var(--border2);
  transform:translateY(-2px);
  box-shadow: 0 12px 32px rgba(0,0,0,.3);
}
.mode-btn .icon {
  width:48px; height:48px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; flex-shrink:0;
}
.mode-btn.pvp .icon { background: linear-gradient(135deg, rgba(212,168,83,.15), rgba(212,168,83,.05)); }
.mode-btn.bot .icon { background: linear-gradient(135deg, rgba(56,189,248,.15), rgba(56,189,248,.05)); }
.mode-btn h3 { font-size:.95rem; font-weight:600; }
.mode-btn small { font-size:.72rem; color:var(--muted); }

.diff-card { display:none; flex-direction:column; gap:.6rem; margin-top:1.2rem; position:relative; }
.diff-card.show { display:flex; }
.diff-btn {
  display:flex; align-items:center; gap:.7rem;
  background:var(--glass); border:1px solid var(--border);
  border-radius:10px; padding:.7rem 1rem;
  cursor:pointer; transition:all .2s;
  font-family:'Outfit',sans-serif; color:var(--text); text-align:left;
}
.diff-btn:hover { background:var(--glass2); border-color:var(--border2); transform:translateY(-1px); }
.diff-btn .d-icon { font-size:1.1rem; }
.diff-btn h4 { font-size:.82rem; font-weight:600; }
.diff-btn small { font-size:.68rem; color:var(--muted); }

/* ── GAME AREA ── */
.game-wrap {
  position:relative; z-index:1;
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:.6rem 1rem 1rem;
  max-width:720px; margin:0 auto; width:100%;
}

/* ── PLAYER BARS ── */
.player-bar {
  display:flex; justify-content:space-between; align-items:center;
  width:100%; padding:.55rem 1rem; margin-bottom:.5rem;
  border-radius:14px; transition:all .4s;
  background: var(--glass);
  border:1px solid transparent;
}
.player-bar.active {
  border-color:var(--border2);
  animation: barPulse 2s ease-in-out infinite;
}
.player-bar.active.p1 {
  background: linear-gradient(135deg, rgba(212,168,83,.06), transparent);
  box-shadow: 0 0 25px var(--p1-glow);
}
.player-bar.active.p2 {
  background: linear-gradient(135deg, rgba(56,189,248,.06), transparent);
  box-shadow: 0 0 25px var(--p2-glow);
}
@keyframes barPulse {
  0%, 100% { opacity:1; }
  50% { opacity:.85; }
}
.player-name {
  font-weight:600; font-size:.9rem;
  display:flex; align-items:center; gap:.5rem;
}
.player-dot {
  width:10px; height:10px; border-radius:50%;
  transition: all .4s;
}
.p1 .player-dot { background: var(--gold); }
.p2 .player-dot { background: var(--cyan); }
.player-bar.active .player-dot {
  box-shadow: 0 0 12px currentColor;
  animation: dotPulse 1.5s ease-in-out infinite;
}
@keyframes dotPulse {
  0%, 100% { transform:scale(1); }
  50% { transform:scale(1.3); }
}
.player-score {
  font-weight:800; font-size:1.3rem;
  transition: transform .3s;
}
.player-score.bump { transform:scale(1.25); }
.p1 .player-score { color:var(--gold2); }
.p2 .player-score { color:var(--cyan); }

/* ── BOARD ── */
.board {
  display:grid;
  grid-template-columns: 1fr 6fr 1fr;
  grid-template-rows: 1fr 1fr;
  width:100%;
  aspect-ratio: 2.6/1;
  max-height: 280px;
  background:
    linear-gradient(145deg, #3d3020, #2a2015 40%, #1e1810 80%);
  border-radius: 999px;
  border: 2px solid rgba(212,168,83,.15);
  box-shadow:
    0 24px 80px rgba(0,0,0,.6),
    0 0 60px rgba(212,168,83,.06),
    inset 0 2px 0 rgba(255,255,255,.06),
    inset 0 -2px 4px rgba(0,0,0,.3);
  padding:.65rem;
  position:relative;
  overflow:hidden;
}
/* Wood grain */
.board::before {
  content:''; position:absolute; inset:0; border-radius:inherit;
  background:
    repeating-linear-gradient(92deg,
      transparent, transparent 18px,
      rgba(255,255,255,.012) 18px, rgba(255,255,255,.012) 19px
    );
  pointer-events:none;
}
/* Inner light rim */
.board::after {
  content:''; position:absolute; inset:3px; border-radius:inherit;
  border: 1px solid rgba(212,168,83,.06);
  pointer-events:none;
}

/* ── STORES ── */
.store {
  grid-row: 1 / -1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  border-radius:999px;
  background: radial-gradient(ellipse at 50% 30%, rgba(60,50,30,.5), rgba(0,0,0,.45));
  border:1px solid rgba(212,168,83,.08);
  box-shadow: inset 0 6px 20px rgba(0,0,0,.5), inset 0 -3px 10px rgba(0,0,0,.2);
  position:relative;
  transition: all .5s;
}
.store-p2 { grid-column:1; }
.store-p1 { grid-column:3; }
.store .count {
  font-size:1.8rem; font-weight:800;
  text-shadow: 0 0 16px rgba(212,168,83,.3);
}
.store-p1 .count { color:var(--gold2); }
.store-p2 .count { color:var(--cyan); }
.store .stones-wrap {
  display:flex; flex-wrap:wrap; justify-content:center;
  gap:2px; padding:.2rem; max-width:85%;
}

/* ── PIT ROWS ── */
.pits-row {
  display:flex; gap:.4rem;
  grid-column:2;
  padding:.2rem .3rem;
}
.pits-top { grid-row:1; direction:rtl; }
.pits-bottom { grid-row:2; }

/* ── PITS ── */
.pit {
  flex:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:.1rem;
  border-radius:50%;
  aspect-ratio:1;
  background: radial-gradient(ellipse at 50% 35%, rgba(50,40,25,.4), rgba(0,0,0,.4));
  border:1px solid rgba(255,255,255,.03);
  box-shadow: inset 0 4px 12px rgba(0,0,0,.45), inset 0 -2px 6px rgba(0,0,0,.15);
  cursor:pointer;
  transition: all .25s;
  position:relative;
}
/* Highlight valid moves for current player */
.pit.playable {
  border-color: rgba(212,168,83,.12);
}
.pit.playable::after {
  content:''; position:absolute; inset:-3px;
  border-radius:50%;
  border:1.5px solid rgba(212,168,83,.12);
  animation: pitGlow 2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes pitGlow {
  0%, 100% { opacity:.4; transform:scale(1); }
  50% { opacity:1; transform:scale(1.02); }
}
.pit:hover:not(.disabled):not(.empty) {
  background: radial-gradient(ellipse at 50% 35%, rgba(212,168,83,.12), rgba(0,0,0,.35));
  border-color: rgba(212,168,83,.25);
  box-shadow: inset 0 4px 12px rgba(0,0,0,.35), 0 0 20px rgba(212,168,83,.12);
  transform: scale(1.08);
}
.pit.disabled, .pit.empty {
  cursor:default; opacity:.5;
}
.pit.disabled::after, .pit.empty::after { display:none; }
.pit .count {
  font-size:.85rem; font-weight:700;
  text-shadow: 0 0 10px rgba(255,255,255,.15);
  pointer-events:none;
  color: rgba(255,255,255,.85);
}
.pit .stones-wrap {
  display:flex; flex-wrap:wrap; justify-content:center;
  gap:2px; max-width:80%; pointer-events:none;
}

/* ── STONES ── */
.stone {
  width:14px; height:14px; border-radius:50%;
  flex-shrink:0;
  position:relative;
  box-shadow:
    inset 0 -3px 4px rgba(0,0,0,.35),
    inset 0 2px 3px rgba(255,255,255,.15),
    0 1px 4px rgba(0,0,0,.3);
  animation: stoneIdle 3s ease-in-out infinite;
  animation-delay: calc(var(--i, 0) * -.3s);
}
@keyframes stoneIdle {
  0%, 100% { transform:translateY(0); }
  50% { transform:translateY(-1px); }
}
.store .stone { width:11px; height:11px; }

.stone-c0 { background: linear-gradient(135deg, #f87171 10%, #dc2626 50%, #991b1b 100%); }
.stone-c1 { background: linear-gradient(135deg, #d4a853 10%, #b8860b 50%, #8b6914 100%); }
.stone-c2 { background: linear-gradient(135deg, #67e8f9 10%, #06b6d4 50%, #0e7490 100%); }
.stone-c3 { background: linear-gradient(135deg, #86efac 10%, #22c55e 50%, #15803d 100%); }
.stone-c4 { background: linear-gradient(135deg, #c4b5fd 10%, #8b5cf6 50%, #6d28d9 100%); }
.stone-c5 { background: linear-gradient(135deg, #fda4af 10%, #f43f5e 50%, #be123c 100%); }

/* ── FLYING STONE ── */
.flying-stone {
  position:fixed;
  width:16px; height:16px; border-radius:50%;
  z-index:50; pointer-events:none;
  box-shadow:
    0 0 16px rgba(212,168,83,.4),
    0 0 6px rgba(255,255,255,.2),
    inset 0 -3px 4px rgba(0,0,0,.3),
    inset 0 2px 3px rgba(255,255,255,.15);
  transition-property: left, top;
  transition-timing-function: cubic-bezier(.22,.68,.36,1.1);
}

/* ── TURN INDICATOR ── */
.turn-indicator {
  margin-top:.7rem;
  font-size:.85rem; font-weight:600; color:var(--muted2);
  text-align:center;
  min-height:1.6em;
  transition: all .3s;
  padding:.3rem .9rem;
  border-radius:20px;
}
.turn-indicator.active-p1 {
  color:var(--gold2);
  background: rgba(212,168,83,.08);
  border:1px solid rgba(212,168,83,.12);
}
.turn-indicator.active-p2 {
  color:var(--cyan);
  background: rgba(56,189,248,.08);
  border:1px solid rgba(56,189,248,.12);
}
.turn-indicator.extra {
  color: #fbbf24;
  background: rgba(251,191,36,.1);
  border:1px solid rgba(251,191,36,.15);
  animation: extraPulse .6s ease-in-out 3;
}
@keyframes extraPulse {
  0%, 100% { transform:scale(1); }
  50% { transform:scale(1.06); }
}

/* ── WINNER OVERLAY ── */
.winner-overlay {
  position:fixed; inset:0; z-index:100;
  background: rgba(8,9,12,.9);
  backdrop-filter: blur(16px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition: opacity .6s;
}
.winner-overlay.show { opacity:1; pointer-events:auto; }

.winner-card {
  text-align:center;
  background: linear-gradient(145deg, var(--bg2), var(--bg3));
  border:1px solid var(--border2);
  border-radius:28px;
  padding:2.8rem 2.4rem;
  width:min(400px, 85vw);
  box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 60px rgba(212,168,83,.06);
  transform:scale(.9);
  transition:transform .5s cubic-bezier(.2,.8,.2,1.2);
}
.winner-overlay.show .winner-card { transform:scale(1); }
.winner-card .trophy { font-size:3.5rem; margin-bottom:.7rem; }
.winner-card h2 { font-size:1.5rem; font-weight:800; margin-bottom:.4rem; }
.winner-card .scores {
  color:var(--muted2); font-size:1.1rem; margin-bottom:1.8rem;
  font-weight:600;
}
.winner-card .btn-row { display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; }
.btn-play {
  background:linear-gradient(135deg, var(--gold), var(--gold-deep));
  color:#fff; border:none;
  border-radius:14px; padding:.7rem 1.8rem;
  font-size:.88rem; font-weight:700; cursor:pointer;
  font-family:'Outfit',sans-serif; transition:all .2s;
  box-shadow: 0 0 24px var(--gold-glow);
  text-shadow: 0 1px 2px rgba(0,0,0,.3);
}
.btn-play:hover { transform:translateY(-2px); box-shadow: 0 0 32px var(--gold-glow); }
.btn-menu {
  background:var(--glass2); color:var(--muted2); border:1px solid var(--border);
  border-radius:14px; padding:.7rem 1.8rem;
  font-size:.88rem; font-weight:500; cursor:pointer;
  font-family:'Outfit',sans-serif; transition:all .2s;
}
.btn-menu:hover { background:var(--glass3); color:var(--text); }

/* ── CAPTURE FLASH ── */
@keyframes captureFlash {
  0% { box-shadow: inset 0 4px 12px rgba(0,0,0,.45), 0 0 0 rgba(212,168,83,0); }
  30% { box-shadow: inset 0 4px 12px rgba(0,0,0,.3), 0 0 30px rgba(212,168,83,.4); }
  100% { box-shadow: inset 0 4px 12px rgba(0,0,0,.45), 0 0 0 rgba(212,168,83,0); }
}
.pit.capture-flash { animation: captureFlash .6s ease-out; }

/* ── RESPONSIVE ── */
@media (max-width:480px) {
  .board { aspect-ratio:2.4/1; max-height:220px; padding:.45rem; border-radius:80px; }
  .pits-row { gap:.22rem; padding:.15rem .2rem; }
  .pit .count { font-size:.7rem; }
  .store .count { font-size:1.3rem; }
  .stone { width:10px; height:10px; }
  .store .stone { width:8px; height:8px; }
  .flying-stone { width:12px; height:12px; }
  .player-bar { padding:.4rem .7rem; }
  .player-score { font-size:1.1rem; }
}
@media (max-width:360px) {
  .board { border-radius:60px; padding:.3rem; }
  .stone { width:8px; height:8px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏺</div>
    <div>
      <div class="logo-text">Man<span>cala</span></div>
    </div>
  </div>
  <a href="hry.html" class="btn-back">← Hry</a>
</header>

<!-- MODE SELECT -->
<div class="overlay" id="mode-overlay">
  <div class="mode-card">
    <h2>Mancala</h2>
    <p>Starověká strategická desková hra</p>
    <div class="mode-buttons">
      <button class="mode-btn pvp" id="btn-pvp">
        <div class="icon">👥</div>
        <div><h3>Dva hráči</h3><small>Hraj s kamarádem na jednom zařízení</small></div>
      </button>
      <button class="mode-btn bot" id="btn-bot">
        <div class="icon">🤖</div>
        <div><h3>Proti botovi</h3><small>Vyber si obtížnost a hraj proti počítači</small></div>
      </button>
    </div>
    <div class="diff-card" id="diff-card">
      <button class="diff-btn" data-depth="1">
        <span class="d-icon">🟢</span>
        <div><h4>Lehká</h4><small>Bot hraje náhodněji</small></div>
      </button>
      <button class="diff-btn" data-depth="4">
        <span class="d-icon">🟡</span>
        <div><h4>Střední</h4><small>Bot přemýšlí dopředu</small></div>
      </button>
      <button class="diff-btn" data-depth="8">
        <span class="d-icon">🔴</span>
        <div><h4>Těžká</h4><small>Bot hraje optimálně</small></div>
      </button>
    </div>
  </div>
</div>

<!-- GAME -->
<div class="game-wrap" id="game-wrap">
  <div class="player-bar p2" id="bar-p2">
    <span class="player-name"><span class="player-dot"></span> <span id="name-p2">Hráč 2</span></span>
    <span class="player-score" id="score-p2">0</span>
  </div>

  <div class="board" id="board">
    <div class="store store-p2" id="store-13">
      <span class="count" id="count-13">0</span>
      <div class="stones-wrap" id="sw-13"></div>
    </div>
    <div class="pits-row pits-top" id="pits-top"></div>
    <div class="pits-row pits-bottom" id="pits-bottom"></div>
    <div class="store store-p1" id="store-6">
      <span class="count" id="count-6">0</span>
      <div class="stones-wrap" id="sw-6"></div>
    </div>
  </div>

  <div class="player-bar p1 active" id="bar-p1">
    <span class="player-name"><span class="player-dot"></span> <span id="name-p1">Hráč 1</span></span>
    <span class="player-score" id="score-p1">0</span>
  </div>

  <div class="turn-indicator active-p1" id="turn-ind">Hráč 1 je na tahu</div>
</div>

<!-- WINNER -->
<div class="winner-overlay" id="winner-overlay">
  <div class="winner-card">
    <div class="trophy" id="w-trophy">🏆</div>
    <h2 id="w-title">Konec hry!</h2>
    <p class="scores" id="w-scores"></p>
    <div class="btn-row">
      <button class="btn-play" id="btn-again">Hrát znovu</button>
      <button class="btn-menu" id="btn-mode">Změnit režim</button>
    </div>
  </div>
</div>

<script>
"use strict";

const PITS_PER_SIDE = 6;
const STORE_P1 = 6;
const STORE_P2 = 13;
const TOTAL = 14;
const INIT_STONES = 4;
const ANIM_DELAY = 200;

const CCW = [0,1,2,3,4,5,6, 12,11,10,9,8,7, 13];
const CCW_NEXT = {};
for (let i = 0; i < CCW.length; i++) CCW_NEXT[CCW[i]] = CCW[(i+1)%CCW.length];
function nextPit(p) { return CCW_NEXT[p]; }

function haptic(ms) {
  if (navigator.vibrate) navigator.vibrate(ms || 8);
}

let board = [];
let turn = 0;
let mode = null;
let botDepth = 4;
let animating = false;
let stoneColors = [];

const modeOverlay = document.getElementById("mode-overlay");
const diffCard    = document.getElementById("diff-card");
const boardEl     = document.getElementById("board");
const barP1       = document.getElementById("bar-p1");
const barP2       = document.getElementById("bar-p2");
const scoreP1     = document.getElementById("score-p1");
const scoreP2     = document.getElementById("score-p2");
const nameP1      = document.getElementById("name-p1");
const nameP2      = document.getElementById("name-p2");
const turnInd     = document.getElementById("turn-ind");
const winOverlay  = document.getElementById("winner-overlay");

const pitEls = [];
const pitsTop = document.getElementById("pits-top");
const pitsBot = document.getElementById("pits-bottom");

for (let i = 0; i < PITS_PER_SIDE; i++) {
  const pit = mk("div", "pit");
  pit.dataset.idx = i;
  pit.innerHTML = `<span class="count" id="count-${i}">0</span><div class="stones-wrap" id="sw-${i}"></div>`;
  pit.addEventListener("click", () => onPitClick(i));
  pitsBot.appendChild(pit);
  pitEls[i] = pit;
}
for (let i = 12; i >= 7; i--) {
  const pit = mk("div", "pit");
  pit.dataset.idx = i;
  pit.innerHTML = `<span class="count" id="count-${i}">0</span><div class="stones-wrap" id="sw-${i}"></div>`;
  pit.addEventListener("click", () => onPitClick(i));
  pitsTop.appendChild(pit);
  pitEls[i] = pit;
}
pitEls[STORE_P1] = document.getElementById("store-6");
pitEls[STORE_P2] = document.getElementById("store-13");

function mk(tag, cls) { const e = document.createElement(tag); e.className = cls; return e; }

// ── MODE SELECTION ──
document.getElementById("btn-pvp").addEventListener("click", () => {
  mode = "pvp"; nameP2.textContent = "Hráč 2";
  modeOverlay.classList.add("hidden"); startGame();
});
document.getElementById("btn-bot").addEventListener("click", () => {
  diffCard.classList.toggle("show");
});
diffCard.addEventListener("click", (e) => {
  const btn = e.target.closest(".diff-btn"); if (!btn) return;
  mode = "bot"; botDepth = parseInt(btn.dataset.depth, 10);
  nameP2.textContent = "Bot";
  modeOverlay.classList.add("hidden"); startGame();
});
document.getElementById("btn-again").addEventListener("click", () => {
  winOverlay.classList.remove("show"); startGame();
});
document.getElementById("btn-mode").addEventListener("click", () => {
  winOverlay.classList.remove("show");
  diffCard.classList.remove("show");
  modeOverlay.classList.remove("hidden");
});

// ── GAME ──
function startGame() {
  board = new Array(TOTAL).fill(0);
  stoneColors = Array.from({ length: TOTAL }, () => []);
  for (let i = 0; i < PITS_PER_SIDE; i++) {
    board[i] = INIT_STONES;
    board[i+7] = INIT_STONES;
    stoneColors[i] = rndColors(INIT_STONES);
    stoneColors[i+7] = rndColors(INIT_STONES);
  }
  board[STORE_P1] = 0; board[STORE_P2] = 0;
  stoneColors[STORE_P1] = []; stoneColors[STORE_P2] = [];
  turn = 0; animating = false;
  renderBoard(); updateUI();
}

function rndColors(n) {
  const a = []; for (let i = 0; i < n; i++) a.push(Math.floor(Math.random()*6)); return a;
}

// ── RENDER ──
function renderBoard() {
  for (let i = 0; i < TOTAL; i++) renderSlot(i);
  // Playable states
  for (let i = 0; i < PITS_PER_SIDE; i++) {
    const p1ok = turn === 0 && board[i] > 0 && !animating;
    pitEls[i].classList.toggle("empty", board[i] === 0);
    pitEls[i].classList.toggle("disabled", !p1ok);
    pitEls[i].classList.toggle("playable", p1ok);
    const j = i + 7;
    const p2ok = turn === 1 && board[j] > 0 && !animating;
    pitEls[j].classList.toggle("empty", board[j] === 0);
    pitEls[j].classList.toggle("disabled", !p2ok);
    pitEls[j].classList.toggle("playable", p2ok);
  }
}

function renderSlot(idx) {
  const cEl = document.getElementById("count-" + idx);
  const sEl = document.getElementById("sw-" + idx);
  if (!cEl || !sEl) return;
  cEl.textContent = board[idx];
  sEl.innerHTML = "";
  const cols = stoneColors[idx] || [];
  for (let j = 0; j < board[idx]; j++) {
    const s = mk("div", "stone stone-c" + (cols[j] ?? j%6));
    s.style.setProperty("--i", String(j));
    sEl.appendChild(s);
  }
}

function updateUI() {
  animateScore(scoreP1, board[STORE_P1]);
  animateScore(scoreP2, board[STORE_P2]);
  barP1.classList.toggle("active", turn === 0);
  barP2.classList.toggle("active", turn === 1);

  turnInd.className = "turn-indicator";
  if (turn === 0) {
    turnInd.textContent = mode === "bot" ? "Jsi na tahu" : "Hráč 1 je na tahu";
    turnInd.classList.add("active-p1");
  } else {
    turnInd.textContent = mode === "bot" ? "Bot přemýšlí…" : "Hráč 2 je na tahu";
    turnInd.classList.add("active-p2");
  }
}

function animateScore(el, target) {
  const cur = parseInt(el.textContent, 10) || 0;
  if (cur === target) return;
  el.textContent = target;
  el.classList.add("bump");
  setTimeout(() => el.classList.remove("bump"), 300);
}

function showExtra() {
  turnInd.className = "turn-indicator extra";
  turnInd.textContent = "Další tah!";
  haptic(20);
}

// ── CLICK ──
function onPitClick(idx) {
  if (animating) return;
  if (turn === 0 && idx >= 0 && idx < PITS_PER_SIDE && board[idx] > 0) {
    haptic(); doMove(idx);
  } else if (turn === 1 && mode === "pvp" && idx >= 7 && idx <= 12 && board[idx] > 0) {
    haptic(); doMove(idx);
  }
}

// ── MOVE + ANIMATION ──
async function doMove(pitIdx) {
  animating = true;
  renderBoard();

  const myStore  = turn === 0 ? STORE_P1 : STORE_P2;
  const oppStore = turn === 0 ? STORE_P2 : STORE_P1;
  const stones   = board[pitIdx];
  const colors   = stoneColors[pitIdx].splice(0, stones);
  board[pitIdx]  = 0;
  renderSlot(pitIdx);

  let pos = pitIdx, lastPos = pitIdx;
  for (let i = 0; i < stones; i++) {
    pos = nextPit(pos);
    if (pos === oppStore) pos = nextPit(pos);
    lastPos = pos;
    await animateStone(pitIdx, pos, colors[i] ?? 0);
    board[pos]++;
    stoneColors[pos].push(colors[i] ?? 0);
    renderSlot(pos);
    haptic(5);
  }

  // Capture
  const captured = checkCapture(lastPos, myStore);
  if (captured) {
    haptic(30);
    pitEls[captured.opp].classList.add("capture-flash");
    await sleep(250);
    await animateCapture(captured.from, captured.opp, myStore);
    pitEls[captured.opp].classList.remove("capture-flash");
  }

  updateUI();

  // Extra turn
  const extraTurn = lastPos === myStore;
  if (extraTurn) { showExtra(); await sleep(700); }

  if (isGameOver()) { await finishGame(); animating = false; return; }
  if (!extraTurn) turn = 1 - turn;
  animating = false;
  renderBoard(); updateUI();

  if (mode === "bot" && turn === 1) { await sleep(500); await doBotTurn(); }
}

function checkCapture(lastPos, myStore) {
  const mySide = myStore === STORE_P1 ? [0,1,2,3,4,5] : [7,8,9,10,11,12];
  if (!mySide.includes(lastPos)) return null;
  if (board[lastPos] !== 1) return null;
  const opp = 12 - lastPos;
  if (board[opp] === 0) return null;
  return { from: lastPos, opp };
}

async function animateCapture(from, opp, store) {
  const n = board[opp];
  const cols = stoneColors[opp].splice(0);
  board[opp] = 0; renderSlot(opp);
  for (let i = 0; i < n; i++) {
    await animateStone(opp, store, cols[i] ?? 0, 120);
    board[store]++; stoneColors[store].push(cols[i] ?? 0);
    renderSlot(store); updateUI();
  }
  const mc = stoneColors[from].pop();
  board[from]--; renderSlot(from);
  await animateStone(from, store, mc ?? 0, 120);
  board[store]++; stoneColors[store].push(mc ?? 0);
  renderSlot(store); updateUI();
}

// ── FLYING STONE ANIMATION ──
function animateStone(fromIdx, toIdx, color, duration) {
  const dur = duration || ANIM_DELAY;
  return new Promise((resolve) => {
    const fEl = pitEls[fromIdx];
    const tEl = pitEls[toIdx];
    if (!fEl || !tEl) { resolve(); return; }

    const fr = fEl.getBoundingClientRect();
    const tr = tEl.getBoundingClientRect();

    const s = mk("div", "flying-stone stone-c" + color);
    const startX = fr.left + fr.width/2 - 8;
    const startY = fr.top + fr.height/2 - 8;
    s.style.left = startX + "px";
    s.style.top  = startY + "px";
    s.style.transitionDuration = dur + "ms";
    document.body.appendChild(s);

    requestAnimationFrame(() => { requestAnimationFrame(() => {
      const endX = tr.left + tr.width/2 - 8 + (Math.random()-.5)*10;
      const endY = tr.top + tr.height/2 - 8 + (Math.random()-.5)*10;
      s.style.left = endX + "px";
      s.style.top  = endY + "px";
    }); });

    setTimeout(() => { s.remove(); resolve(); }, dur + 40);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── GAME OVER ──
function isGameOver() {
  return board.slice(0, PITS_PER_SIDE).every(n => n === 0)
      || board.slice(7, 13).every(n => n === 0);
}

async function finishGame() {
  for (let i = 0; i < PITS_PER_SIDE; i++) {
    if (board[i] > 0) {
      const c = stoneColors[i].splice(0), n = board[i];
      board[i] = 0; renderSlot(i);
      for (let j = 0; j < n; j++) {
        await animateStone(i, STORE_P1, c[j]??0, 80);
        board[STORE_P1]++; stoneColors[STORE_P1].push(c[j]??0);
        renderSlot(STORE_P1); updateUI();
      }
    }
    const k = i + 7;
    if (board[k] > 0) {
      const c = stoneColors[k].splice(0), n = board[k];
      board[k] = 0; renderSlot(k);
      for (let j = 0; j < n; j++) {
        await animateStone(k, STORE_P2, c[j]??0, 80);
        board[STORE_P2]++; stoneColors[STORE_P2].push(c[j]??0);
        renderSlot(STORE_P2); updateUI();
      }
    }
  }
  renderBoard(); updateUI();
  haptic(50);
  await sleep(600);
  showWinner();
}

function showWinner() {
  const s1 = board[STORE_P1], s2 = board[STORE_P2];
  const trophy = document.getElementById("w-trophy");
  const title  = document.getElementById("w-title");
  const scores = document.getElementById("w-scores");

  if (s1 > s2) {
    trophy.textContent = "🏆";
    title.textContent = mode === "bot" ? "Vyhrál jsi!" : "Hráč 1 vyhrál!";
    title.style.color = "var(--gold2)";
  } else if (s2 > s1) {
    trophy.textContent = mode === "bot" ? "😔" : "🏆";
    title.textContent = mode === "bot" ? "Bot vyhrál" : "Hráč 2 vyhrál!";
    title.style.color = "var(--cyan)";
  } else {
    trophy.textContent = "🤝";
    title.textContent = "Remíza!";
    title.style.color = "var(--gold2)";
  }
  scores.textContent = s1 + " : " + s2;
  winOverlay.classList.add("show");
}

// ── BOT AI (Minimax + Alpha-Beta) ──
async function doBotTurn() {
  if (turn !== 1 || mode !== "bot") return;
  const move = bestMove(board, botDepth);
  if (move === -1) return;
  await doMove(move);
}

function bestMove(b, depth) {
  const moves = validMoves(b, 1);
  if (!moves.length) return -1;
  let best = -Infinity, pick = moves[0];
  for (const m of moves) {
    const { board: nb, extra } = simulate(b, m, 1);
    const val = extra
      ? minimax(nb, depth-1, -Infinity, Infinity, true)
      : minimax(nb, depth-1, -Infinity, Infinity, false);
    if (val > best) { best = val; pick = m; }
  }
  return pick;
}

function minimax(b, depth, alpha, beta, isMax) {
  if (depth === 0 || gameOverCheck(b)) return evaluate(b);
  const player = isMax ? 1 : 0;
  const moves = validMoves(b, player);
  if (!moves.length) return evaluate(b);
  if (isMax) {
    let v = -Infinity;
    for (const m of moves) {
      const { board: nb, extra } = simulate(b, m, player);
      v = Math.max(v, minimax(nb, depth-1, alpha, beta, extra));
      alpha = Math.max(alpha, v);
      if (beta <= alpha) break;
    }
    return v;
  } else {
    let v = Infinity;
    for (const m of moves) {
      const { board: nb, extra } = simulate(b, m, player);
      v = Math.min(v, minimax(nb, depth-1, alpha, beta, !extra));
      beta = Math.min(beta, v);
      if (beta <= alpha) break;
    }
    return v;
  }
}

function evaluate(b) { return b[STORE_P2] - b[STORE_P1]; }

function validMoves(b, player) {
  const start = player === 0 ? 0 : 7, end = start + PITS_PER_SIDE;
  const m = [];
  for (let i = start; i < end; i++) if (b[i] > 0) m.push(i);
  return m;
}

function simulate(b, pitIdx, player) {
  const nb = b.slice();
  const myStore  = player === 0 ? STORE_P1 : STORE_P2;
  const oppStore = player === 0 ? STORE_P2 : STORE_P1;
  const stones = nb[pitIdx]; nb[pitIdx] = 0;
  let pos = pitIdx, lastPos = pitIdx;
  for (let i = 0; i < stones; i++) {
    pos = nextPit(pos);
    if (pos === oppStore) pos = nextPit(pos);
    nb[pos]++; lastPos = pos;
  }
  const mySide = player === 0 ? [0,1,2,3,4,5] : [7,8,9,10,11,12];
  if (mySide.includes(lastPos) && nb[lastPos] === 1) {
    const opp = 12 - lastPos;
    if (nb[opp] > 0) { nb[myStore] += nb[opp]+1; nb[opp] = 0; nb[lastPos] = 0; }
  }
  return { board: nb, extra: lastPos === myStore };
}

function gameOverCheck(b) {
  return b.slice(0, PITS_PER_SIDE).every(n => n===0) || b.slice(7,13).every(n => n===0);
}
</script>
</body>
</html>
